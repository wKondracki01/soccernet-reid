# Main Hydra config. Composes per-component configs from sub-folders.
# Override on CLI: `uv run python scripts/train.py backbone=eb1 loss=ms ...`
# Or compose via experiment file: `+experiment=smoke`.

defaults:
  - backbone: r18
  - head: projection
  - loss: tri
  - sampler: pk
  - transform: aug-min
  - _self_

# Experiment identity (used for output dir + W&B run name)
experiment_name: ref

# Reproducibility
seed: 0
deterministic: false   # CUDA cuDNN deterministic mode (slows training noticeably)

# Embedding
embedding_dim: 512

# Data paths
catalog_path: outputs/catalog.parquet
reid_root: dataSoccerNet/reid-2023

# Training schedule
num_epochs: 60
num_iters_per_epoch: 5000
log_every: 50
# Run only the first N epochs and stop; the LR schedule still spans num_epochs.
# For diagnostics of the early phase of a long schedule. null = run all epochs.
stop_after_epochs: null
# Every N training steps log the share of non-zero weights, the spread of the
# batch embeddings and the loss-gradient norm (see training/health.py). 0 = off.
diagnostics_every: 250

# Optim
# weight_decay is 0 on purpose. torch.optim.Adam adds it to the gradient as an L2
# term BEFORE the adaptive scaling, so for a loss with small gradients (triplet,
# MS, contrastive) it pulls weights to zero at close to the full learning-rate
# speed. With 5e-4 (the value of the May 2026 runs) 97-99% of the convolution
# weights ended as numerical zeros and the AUG-STRONG / AUG-BOT runs collapsed;
# the same AUG-BOT run with 0 reaches mAP 0.785 (DIAG_BOT_WD5E4 vs DIAG_BOT_WD0).
optimizer:
  name: adam
  lr: 3.5e-4
  weight_decay: 0.0
scheduler:
  warmup_epochs: 5
  min_lr_ratio: 0.0

# Backend
device: auto         # auto / cuda / mps / cpu
# Full precision by default: in May 2026 mixed precision crashed or produced NaN
# with EfficientNet-B2/B3/B4 and with EB1 + AUG-MED, so runs ended up split
# between AMP and FP32. Set amp=true only for a deliberate speed test.
amp: false           # mixed precision (CUDA only)
num_workers: 4

# Evaluation (during training and at end)
eval:
  batch_size: 64
  every_n_epochs: 5    # 10 in the May 2026 runs; 5 gives denser learning curves
  ranks: [1, 5, 10]
  distance: cosine
  split: valid

# Weights & Biases
wandb:
  enabled: true
  project: soccernet-reid
  mode: online       # online / offline / disabled
  tags: []
  notes: ""

# Outputs
output_dir: outputs/runs/${experiment_name}

# Hydra runtime config
hydra:
  run:
    dir: ${output_dir}
  job:
    chdir: false
